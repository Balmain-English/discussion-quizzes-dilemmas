  {text:"Contact the platform to flag the situation as a welfare concern so there is a record, while instructing Magda to call 999 only if she hears anything that sounds physically dangerous.",pts:2,fb:"Correct proportional response. You've documented the concern without escalating it unnecessarily. Magda was given clear, manageable instructions. The argument resolved itself within the hour. The guests left at checkout, did not mention any of this, and left 3 stars for 'atmosphere.' The platform record protects you if anything is ever claimed."},
  {text:"Message the guests directly to say you're aware they're having a difficult time and to ask if everything is okay.",pts:-2,repeat:true,fb:"You have just informed two people in the middle of a private argument that they are being monitored. Both guests have now separately complained to the platform that you are surveilling them through the walls. Magda is implicated. Magda is unhappy about this. This is not what she signed up for."}
]},

{id:"listing1",title:"Your Listing Has Been Flagged as 'Potentially Misleading'",
text:"The platform has sent you a notification: your listing has been automatically flagged because the number of rooms mentioned in your description (4) does not match the number of rooms in your photos (3). Your property has 3 rooms. You wrote 4 in the original listing by mistake two years ago. Nobody has complained about this specifically, but the platform wants you to correct it within 7 days or your listing may be suppressed.",
choices:[
  {text:"Correct the number immediately, update any related descriptions to be accurate, and confirm the correction to the platform within the 7-day window.",pts:2,fb:"Correct and swift. The flag was cleared within 24 hours. No suppression, no penalty. The listing is now accurate for the first time in two years. Several guests had clearly noticed but said nothing. You have also re-read your entire listing description and found two other inaccuracies. You have corrected those too."},
  {text:"Ignore it. The platform flags things all the time and nobody has ever complained.",pts:-2,repeat:true,fb:"On day 8, your listing is suppressed. Bookings stop. You contact support. They explain the 7-day window. You ask for an exception. There is not one. You correct the error. The listing is reinstated after a further review period of 5 business days. You have lost approximately 13 days of visibility in peak season."},
  {text:"Add a fourth 'room' to your listing — the bathroom technically counts as a room, right?",pts:-1,fb:"The bathroom does not technically count as a room in hospitality listings. The platform's automated system has now flagged 'misleading room count' AND 'inaccurate amenity description' as two separate issues. Your 7-day window has been reduced to 3 days because this is your second flag."},
  {text:"Contest the flag on the grounds that the hallway could reasonably be considered a room.",pts:-1,fb:"The support agent has considered your hallway. The support agent does not consider your hallway to be a room. The flag stands. You now have 5 days left in your window and have spent two of them arguing about a hallway."}
]},

{id:"tax1",title:"HMRC Has Sent You a Letter",
text:"A letter from HMRC. They're aware you've been earning income from short-term lets (platforms share data now) and they'd like you to confirm whether you've been declaring this income correctly on your self-assessment tax return. You have not been filing a self-assessment tax return. You have been treating the income as 'extra cash.' You have been doing this for three years.",
choices:[
  {text:"Ignore the letter. You're very small. They won't bother.",pts:-2,repeat:true,fb:"HMRC has bothered. They have issued an estimated tax demand based on their platform data, plus interest, plus a penalty for non-disclosure. The estimated amount is wrong but the penalty structure is accurate. You needed an accountant from the very beginning. You now need a specialist accountant and possibly a solicitor."},
  {text:"Contact an accountant immediately, disclose everything, use HMRC's voluntary disclosure process to get ahead of it, and register for self-assessment.",pts:2,fb:"The voluntary disclosure process exists precisely for this. An accountant costs money but far less than HMRC penalties applied without mitigation. The tax owed was real but manageable. The penalties were reduced significantly for voluntary disclosure. You now file self-assessment and have discovered the Rent-a-Room relief scheme, which you should have been using from the start."},
  {text:"Write back to HMRC saying you didn't know you needed to declare it.",pts:-1,fb:"'I didn't know' is not a defence against tax liability. It is a mitigating factor that may reduce penalties slightly. HMRC has noted your response and issued a formal enquiry. You still need an accountant. You should have called one before writing to HMRC."},
  {text:"Declare only the income from the past 12 months and hope they're satisfied.",pts:-1,fb:"Selective disclosure is worse than full disclosure and better than nothing. HMRC has cross-referenced three years of platform data. Your partial disclosure covers one of them. They now have an inconsistency to investigate. You've made your position worse by appearing to conceal."}
]},

{id:"checkout2",title:"The Guests Have Reported Bedbugs",
text:"A guest has messaged, with photos, claiming to have found bedbugs in the mattress. The photos are genuinely concerning — small brown marks consistent with bedbug activity. You had the property professionally cleaned a month ago. The previous guest left no complaints. You have absolutely no idea if this is real or a fraud attempt, which is apparently a thing.",
choices:[
  {text:"Call a licensed pest control specialist to inspect the property immediately, remove the mattress from service pending inspection, and communicate your response actions clearly to the guest.",pts:2,fb:"The correct response regardless of whether it's genuine or fraudulent. If genuine: you've acted responsibly and have documentation. If fraudulent: you have documentation of your professional response and the pest controller's clearance report, which the platform accepts as evidence. Either way, this is resolved. The inspector found no bedbugs. The mattress was reinstated. You have a pest control certificate."},
  {text:"Tell the guest that bedbugs are impossible since you had a clean a month ago and ask them to prove it.",pts:-2,repeat:true,fb:"'Prove it' is not a guest communications strategy. The guest has already proved it with photos which they are now sharing on a travel forum. Your listing name is now searchable alongside the word 'bedbugs.' The platform is very interested in your response message."},
  {text:"Offer a full refund immediately to make it go away.",pts:-1,fb:"You've financially validated an allegation you haven't investigated. The pest controller you eventually hired found nothing. You've refunded £320 for bedbugs that were not there and have no documentation. The guest's photos remain unaddressed. Future guests who search your listing will find a refund issued for a bedbug complaint."},
  {text:"Ask the platform to investigate and do nothing in the meantime.",pts:0,fb:"The platform investigation takes four days, during which time the guest is still in your property — with alleged bedbugs — and you've taken no action. The platform asked why you hadn't called pest control. Good question, Susan. Good question."}
]},


{id:"diy1",title:"The Guest Has Attempted Some DIY",
text:"Your checkout photos — taken by Magda, who deserves a raise — show that a guest has, during their four-night stay, attempted to 'fix' your bathroom cabinet door with what appears to be a combination of wood glue, a nail, and something that might be a cheese knife. The cabinet is now worse than before. But they've left a note saying 'sorted the cabinet, you're welcome.'",
choices:[
  {text:"Reply: 'Thank you so much! Very kind of you.' And leave it at that.",pts:-1,fb:"You have now thanked someone for making your cabinet worse and have no grounds for a damage claim because you've explicitly expressed gratitude. The cheese knife is still in the hinge. A joiner charges £120 to undo the repair."},
  {text:"Document the damage with photos, get a quote from a joiner for the correct repair, and raise a resolution claim for the cost of remediation minus any goodwill acknowledgement that they meant well.",pts:2,fb:"Correct. Intent is irrelevant to a damage claim — the cabinet needs fixing regardless of the note. The claim covered the joiner's fee. You replied to the guest acknowledging their kind intention while explaining that unauthorised repairs create liability issues. They apologised. The note was charming. The claim was valid."},
  {text:"Fix it yourself with some wood glue. Two can play at this game.",pts:0,fb:"Your repair is better than theirs, which is not saying much. The cabinet functions approximately correctly. You've spent a Sunday afternoon on someone else's enthusiastic mistake and recovered nothing financially. The cheese knife is yours now. You found it in the hinge."},
  {text:"Add 'please do not attempt repairs' to your house rules and say nothing more.",pts:-2,repeat:true,fb:"Adding a rule retroactively does not repair a cabinet. The guest has now left a review saying the host was 'cold and ungrateful despite all we did for them.' You have no claim filed. You have a broken cabinet, a bad review, and a rule that should have been there already. The cheese knife is still in the hinge."}
]},

{id:"cleaner1",title:"Magda Has Discovered Something in the Wardrobe",
text:"Magda has called. She has found, in the wardrobe of the main bedroom, what she describes as 'a significant quantity of a leafy material in zip-lock bags, a set of small scales, and a laminated price list.' The guests checked out this morning. The laminated price list is very professionally done. Magda wants guidance. Magda is not going to touch it.",
choices:[
  {text:"Tell Magda to throw it all away discreetly and don't mention it to anyone.",pts:-2,repeat:true,fb:"Magda has thrown away what is now established evidence in a drug supply investigation. You have both tampered with evidence and failed to report found contraband. The guests were already under surveillance. The police have visited the property. Magda is involved. Magda is not happy about being involved."},
  {text:"Tell Magda to leave the property immediately without touching anything, and call the non-emergency police line to report found property of illegal nature.",pts:2,fb:"Correct. Magda left. You called. The police attended within two hours, were thorough and professional, and confirmed you had no culpability as a host acting in good faith. The property was cleared and released within 24 hours. You have added 'no illegal substances' to your house rules, which you should have had already."},
  {text:"Tell Magda to photograph it and send the photos to you before doing anything.",pts:0,fb:"Magda photographed it. The photos are now on Magda's phone. You now both have photos of drug paraphernalia of uncertain legal significance. You eventually called the police, who were satisfied with your account but less satisfied with the photographs on Magda's phone, which required some explanation."},
  {text:"Message the guest to say they've left some items behind and ask if they'd like to collect them.",pts:-1,fb:"You have just informed a drug dealer that you have found their inventory and are holding it for collection. They did not reply. You have now been in possession of illegal substances for 48 hours while waiting for a message response. Call the police, Susan. This is what the police are for."}
]},

{id:"parking1",title:"Your Guest Has Received a Parking Fine in Your Parking Space",
text:"A parking fine notice has been forwarded to you for a vehicle parked in your allocated resident's space during your last guest's stay. The vehicle is not your guest's vehicle. Someone else parked there, and the fine — issued to the space, not the vehicle — has arrived in your name. It is for £85.",
choices:[
  {text:"Pay the fine. It's easiest.",pts:-1,fb:"It is easiest. It is also incorrect. You were not the offending driver, you did not park the offending vehicle, and paying the fine without appeal establishes a payment record. You've spent £85 because admin felt like too much effort."},
  {text:"Appeal the fine with evidence that the space was occupied by an unrelated vehicle during your guest's stay, provide the booking dates and your guest's vehicle registration, and formally contest the notice.",pts:2,fb:"Correct. The fine was overturned. The appeal took 20 minutes to write and cost nothing. You've also now established that your parking space needs a visible 'Reserved' sign and a method for guests to report unauthorised occupants. You've ordered both. The £85 remains yours."},
  {text:"Ignore it. Parking fines escalate when ignored but you'll deal with it then.",pts:-2,repeat:true,fb:"The fine has escalated to £170. Then to a debt collection notice. Then to a court summons because you missed the escalation window. You are now defending a parking fine in court for a car you never parked, for £85 that is now costing you £340 plus time. Appeal, Susan. Always appeal."},
  {text:"Contact your guest to ask if they know whose car it is.",pts:0,fb:"They don't know. Nobody knows. The car has vanished. You've spent three days in a thread of confusion about a mystery vehicle and still have the fine. The appeal process was always the right answer."}
]},

{id:"smoking1",title:"Someone Has Smoked in Your No-Smoking Property",
text:"Your listing states very clearly: strictly no smoking. Magda has called. The entire flat smells strongly of cigarettes. The curtains, the sofa, and — impressively — the inside of the fridge all smell of cigarettes. The guest left a 5-star review 40 minutes ago. The review praises the 'cosy atmosphere.'",
choices:[
  {text:"Accept the 5-star review gratefully and open the windows. It'll air out.",pts:-2,repeat:true,fb:"It has not aired out. Your next guests arrive to a property that smells like a 1987 pub and leave a 1-star review about 'undisclosed smoking odour.' You had 14 days from the previous checkout to file a damage claim for professional deodorising. That window has now closed. The 5-star review remains. Cold comfort."},
  {text:"Immediately raise a damage claim for professional deodorising and deep cleaning of soft furnishings, with Magda's contemporaneous report as evidence, before responding to the review.",pts:2,fb:"Correct order of operations. Claim first, review second. You recovered £180 in cleaning costs. Your response to the 5-star review thanked them warmly while noting that you hoped they enjoyed the property's fresh-air policy going forward. Very measured. Very Susan-at-her-best."},
  {text:"Reply to the 5-star review saying 'thank you for the kind words, though we note the strict no-smoking policy was not observed during this stay.'",pts:-1,fb:"You've publicly accused a guest of a house rule violation in the review response section, which is not what review responses are for. The guest has now amended their review to 4 stars and added a note about 'hostile host communication.' Raise a claim. Don't use the review section as a disciplinary forum."},
  {text:"Book a professional cleaning company for tomorrow and charge the cost to your own account, filing nothing.",pts:0,fb:"The flat is clean. Magda is relieved. You are £200 lighter for no reason because the resolution centre exists precisely for this situation and you chose not to use it. Correct operational outcome, completely unnecessary financial loss."}
]},

{id:"corporate1",title:"The 'Business Trip' That Wasn't",
text:"A guest booked for a solo business trip, seven nights. Magda has confirmed via mid-stay check that there are two people in the property. This is technically a breach of the single-guest booking. Both people seem perfectly nice. The flat is clean. Nothing alarming is happening. But the booking says one person and there are two people.",
choices:[
  {text:"It's fine. They're nice. Let it go.",pts:0,fb:"It is, in this instance, fine. They were perfectly nice. Nothing happened. But you've now established a personal precedent that you overlook guest count discrepancies when people seem pleasant, which will serve you very poorly the next time the extra person is less pleasant."},

// ═══════════════════════════════════════════════════════════════════════════
// STATE & SEQUENCE BUILDER
// Per game: pick 16 regular scenarios from pool of 48 (Fisher-Yates),
// interleave 4 emergencies after every 4th regular.
// Total steps per game: 20 (16 regular + 4 emergency).
// Max score: 16 × 2 = 32.
// ═══════════════════════════════════════════════════════════════════════════
let score=0, currentStep=0, gameSequence=[];

function buildSequence(){
  // Separate the 4 massage scenarios from the rest of the pool
  const massageIds = ['massage1','massage2','massage3','massage4'];
  const massagePool = scenarioPool.filter(s => massageIds.includes(s.id));
  const regularPool = scenarioPool.filter(s => !massageIds.includes(s.id));

  // Pick exactly one massage scenario at random
  const chosenMassage = shuffle(massagePool)[0];

  // Draw 15 from the remaining 44 non-massage scenarios
  const otherDrawn = shuffle(regularPool).slice(0, 15);

  // Place chosenMassage at regular-slot index 8.
  // Sequence layout: R R R R E R R R R E R R [R=massage] R E R R R R E
  // Regular slot 8 (0-indexed) lands at overall sequence position 13 (1-indexed) ✓
  const regulars = [
    ...otherDrawn.slice(0, 8),   // slots 0-7  → positions 1-8 in game
    chosenMassage,                // slot 8     → position 13 in game
    ...otherDrawn.slice(8, 15)    // slots 9-15 → positions 14-16 in game
  ];

  const emergs = shuffle(emergencyScenarios); // all 4, shuffled
  const seq = [];
  for(let i = 0; i < 16; i++){
    seq.push({...regulars[i], type:'regular'});
    if((i + 1) % 4 === 0){
      seq.push({...emergs[Math.floor(i / 4)], type:'emergency'});
    }
  }
  return seq; // 20 steps total
}

function updateUI(){
  document.getElementById('scoreDisplay').textContent=score;
  const total=gameSequence.length;
  document.getElementById('stepDisplay').textContent=`${Math.min(currentStep,total)}/${total}`;
  const pct=total>0?(currentStep/total)*100:0;
  document.getElementById('progressFill').style.width=pct+'%';
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
function renderIntro(){
  document.getElementById('gameArea').innerHTML=`
    <div class="intro-card">
      <h2>Welcome to Your Property. Good Luck.</h2>
      <div class="divider"></div>
      <p>You are Susan. You have listed your flat on HomeBnb because someone told you it was 'passive income.' It is not passive. Nothing about this is passive.</p>
      <p>You will face <strong>16 hosting scenarios</strong> and <strong>4 genuine emergencies</strong> drawn from a pool of real-life hosting disasters. No two games are the same.</p>
      <p style="font-size:.88rem;color:#888;">There are no right answers. There are wrong answers. You will find them.</p>
      <button class="start-btn" onclick="startGame()">I Am Ready (I Am Not Ready)</button>
    </div>`;
}

function renderStep(){
  if(currentStep>=gameSequence.length){renderFinal();return;}
  const scenario=gameSequence[currentStep];
  updateUI();
  const isEmerg=scenario.type==='emergency';
  const shuffled=shuffle(scenario.choices);
  window._currentChoices=shuffled;
  document.getElementById('gameArea').innerHTML=`
    <div class="card ${isEmerg?'emergency':''}">
      <div class="step-counter">${currentStep+1} / ${gameSequence.length}</div>
      ${isEmerg?'<div class="emergency-badge">⚠ EMERGENCY ⚠</div>':''}
      <h2>${scenario.title}</h2>
      <p class="scenario-text">${scenario.text}</p>
      <div class="choices">
        ${shuffled.map((c,i)=>`<button class="choice-btn" onclick="handleChoice(${i})">${c.text}</button>`).join('')}
      </div>
    </div>`;
}

function handleChoice(idx){
  const choice=window._currentChoices[idx];
  const scenario=gameSequence[currentStep];
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if(scenario.type==='emergency'&&choice.pts===-2){
    score+=choice.pts; renderGameOver(choice); return;
  }
  if(choice.pts===-2&&choice.repeat){
    score+=choice.pts; window._repeatExclude=choice; updateUI();
    renderFeedback(choice,scenario,true); return;
  }
  score+=choice.pts; updateUI(); renderFeedback(choice,scenario,false);
}

function renderFeedback(choice,scenario,willRepeat){
  let tc='bad',icon='😬',pc='pts-neg';
  if(choice.pts===2){tc='good';icon='✅';pc='pts-pos';}
  else if(choice.pts===0){tc='ok';icon='😐';pc='pts-zero';}
  else if(choice.pts===-2){tc='terrible';icon='💥';}
  const hl={2:'Good call.',0:'Fine. I suppose.','-1':'Oh, Susan.','-2':'Oh NO, Susan.'}[choice.pts]||'Oh, Susan.';
  const nl=willRepeat?'Try Again (You Must)':(currentStep+1>=gameSequence.length?'See Your Results':'Next Disaster →');
  document.getElementById('gameArea').innerHTML=`
    <div class="feedback-card">
      <div class="feedback-icon">${icon}</div>
      <div class="feedback-title ${tc}">${hl}</div>
      <div class="feedback-pts ${pc}">${choice.pts>0?'+':''}${choice.pts} points</div>
      <p class="feedback-body">${choice.fb}</p>
      ${willRepeat?'<p style="color:#c1440e;font-weight:700;font-size:.9rem;margin-bottom:12px;">You must choose again — without that option.</p>':''}
      <button class="next-btn" onclick="${willRepeat?'repeatStep()':'nextStep()'}">${nl}</button>
    </div>`;
}

function repeatStep(){
  const scenario=gameSequence[currentStep];
  const ex=window._repeatExclude;
  const filtered=shuffle(scenario.choices.filter(c=>c!==ex&&!(c.pts===-2&&c.repeat)));
  window._repeatChoices=filtered;
  document.getElementById('gameArea').innerHTML=`
    <div class="card">
      <div class="step-counter">${currentStep+1} / ${gameSequence.length}</div>
      <div class="emergency-badge" style="background:#8B1A1A">↩ CHOOSE AGAIN</div>
      <h2>${scenario.title}</h2>
      <p class="scenario-text">${scenario.text}</p>
      <div class="choices">
        ${filtered.map((c,i)=>`<button class="choice-btn" onclick="handleRepeat(${i})">${c.text}</button>`).join('')}
      </div>
    </div>`;
}

function handleRepeat(idx){
  const choice=window._repeatChoices[idx];
  const scenario=gameSequence[currentStep];
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  score+=choice.pts; updateUI(); renderFeedback(choice,scenario,false);
}

function nextStep(){currentStep++;renderStep();}

function renderGameOver(choice){
  updateUI();
  document.getElementById('gameArea').innerHTML=`
    <div class="feedback-card gameover">
      <div class="feedback-icon">🚔</div>
      <div class="feedback-title arrest">GAME OVER: ARRESTED</div>
      <div class="feedback-pts pts-neg">-2 points &amp; end of the road</div>
      <p class="feedback-body">${choice.fb}</p>
      <p style="color:#ff6b6b;font-weight:700;margin-bottom:20px;font-size:.95rem;">Susan's hosting career has come to an abrupt and legally significant end.</p>
      <button class="next-btn" onclick="renderFinal()">See Final Score</button>
    </div>`;
}

function renderFinal(){
  const band=bands.find(b=>score>=b.min&&score<=b.max);
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('gameArea').innerHTML=`
    <div class="final-card">
      <div style="font-size:3.5rem">${band.icon}</div>
      <h2>${band.title}</h2>
      <div class="final-score-big">${score}</div>
      <div style="font-size:.85rem;color:#888;margin-bottom:16px;font-family:'Permanent Marker',cursive">OUT OF 32</div>
      <div class="divider"></div>
      <p class="final-verdict">${band.verdict}</p>
      <button class="restart-btn" onclick="startGame()">Play Again (You Monster)</button>
      <p class="again-note">48 scenarios in the pool. 16 drawn at random each game. Choices reshuffled every time. Play three times and you may never see the same game twice.</p>
    </div>`;
}

function startGame(){
  gameSequence=buildSequence();
  currentStep=0; score=0;
  window._repeatExclude=null;
  updateUI(); renderStep();
}

renderIntro();
updateUI();
</script>
